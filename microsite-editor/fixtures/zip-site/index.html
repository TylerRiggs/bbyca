<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wingtip Toys — Holiday Line</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .banner { background-image: url("img/chart.png"); background-size: cover; }
</style>
</head>
<body>
<header class="masthead">
  <img src="img/logo.svg" width="56" height="56" alt="Wingtip Toys logo">
  <h1>Wingtip Toys holiday line</h1>
  <p class="tagline">Prepared for the Relecloud retail team.</p>
</header>
<main>
  <section class="banner">
    <h2>Sales are climbing</h2>
    <p>Week over week, the pilot stores keep beating forecast.</p>
  </section>
  <section>
    <h2>The numbers</h2>
    <img src="img/chart.png" srcset="img/chart.png 1x" width="384" height="216" alt="Weekly sales chart">
    <p>Eight straight weeks of growth, with the strongest lift in the toddler range.</p>
  </section>
  <section class="cta-row" style='background-image: url("img/chart.png"); background-size: cover;'>
    <a class="cta" href="https://example.com/order">Place your holiday order</a>
  </section>
</main>
<footer>
  Wingtip Toys · hello@example.com
</footer>
</body>
</html>
